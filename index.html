<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Bag Chaser</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-black text-white selection:bg-green-500 selection:text-black">
    <script>
      window.addEventListener('error', function(e) {
        // Only trigger if #root is empty (likely a boot crash)
        var root = document.getElementById('root');
        if (!root || !root.innerHTML || root.innerHTML === '') {
          document.body.innerHTML = '<div style="background:#0f172a;color:#f87171;padding:32px;font-family:monospace;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:999999;overflow:auto;">' +
            '<h1 style="color:white;margin-bottom:16px;">FATAL MODULE CRASH</h1>' +
            '<p style="font-size:18px;"><b>Error:</b> ' + e.message + '</p>' +
            '<p><b>File:</b> ' + e.filename + '</p>' +
            '<p><b>Line:</b> ' + e.lineno + ':' + e.colno + '</p>' +
            '<button onclick="localStorage.clear();location.reload();" style="margin-top:24px;padding:12px 24px;background:#ef4444;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">WIPE CACHE & REBOOT</button>' +
            '</div>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
